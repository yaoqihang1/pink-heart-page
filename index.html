<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffcccc, #ff99cc);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .heart {
            position: relative;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            transform: rotate(-45deg);
            animation: float 3s ease-in-out infinite, pulse 1.5s infinite;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.8), 0 0 60px rgba(255, 105, 180, 0.6);
        }
        .heart:before,
        .heart:after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border-radius: 50%;
        }
        .heart:before {
            top: -75px;
            left: 0;
        }
        .heart:after {
            left: 75px;
            top: 0;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1) rotate(-45deg);
            }
            50% {
                transform: scale(1.2) rotate(-45deg);
            }
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(-10px) rotate(-45deg);
            }
            50% {
                transform: translateY(10px) rotate(-45deg);
            }
        }
        .message-container {
            margin-top: 200px;
            text-align: center;
        }
        .message {
            color: #ffffff;
            font-size: 30px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
            font-family: 'Great Vibes', cursive;
        }
        .sub-message {
            margin-top: 10px;
            color: #ffffff;
            font-size: 22px;
            font-style: italic;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
            font-family: 'Great Vibes', cursive;
        }
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 70%);
            opacity: 0.3;
            animation: twinkling 5s infinite;
        }
        @keyframes twinkling {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="heart"></div>
    <div class="message-container">
        <div class="message">给你的一颗粉红心 ❤️</div>
        <div class="sub-message">希望你的每一天都充满爱与喜悦</div>
    </div>
    <div class="stars"></div>
</body>
</html>
